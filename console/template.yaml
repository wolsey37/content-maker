AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  content-maker 서버(API) 모드 — Lambda(Function URL) + S3(미디어/작업) + provider 키 시크릿.
  SAM 으로 코드 패키징·배포(`sam deploy --resolve-s3`). JWT 검증용 jwt-secret 은 기존 prod/connect 참조만.
  콘텐츠 API 는 Cloudflare 프록시 없이 Function URL 직접 호출(100초 524 회피, 타임아웃 300s).

Parameters:
  MediaBucketName:
    Type: String
    Default: prod-content-maker-data
    Description: 생성 이미지 + 작업(JSON) 저장 S3 버킷(전역 유일).
  ProviderSecretName:
    Type: String
    Default: content-maker
    Description: provider API 키(OPENAI_API_KEY·GEMINI_API_KEY 등) 시크릿 이름. 외부에서 생성·관리(스택은 참조만).
  JwtSecretArn:
    Type: String
    Description: 기존 JWT 시크릿(prod/connect) 전체 ARN. 읽기 권한만 부여(생성 X).
  AllowedOrigins:
    Type: String
    Description: 콘솔(Cloudflare Pages) origin. 콤마 구분. 예) https://content-maker.pages.dev
  OpenAiTextModel:
    Type: String
    Default: gpt-5.5
    Description: OpenAI 텍스트 모델 id(실제 API 모델로 조정).

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 300
    MemorySize: 512

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 실수 삭제/덮어쓰기 복구용 버저닝(작업 JSON 은 PUT 마다 덮어쓰고 DELETE 는 cascade 영구삭제) — NoncurrentVersionExpiration 로 비용 통제.
      VersioningConfiguration:
        Status: Enabled
      # 암호화를 IaC 로 못박아 drift 제거(현재 라이브는 SSE-S3/AES256).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # 라이프사이클: 멀티파트 잔여물 정리 + 비현행 버전 만료 + 배포 아티팩트 단기 만료.
      # 미디어 본문(content/<jobId>/)은 보존정책 미확정이라 자동 만료하지 않는다(데이터 손실 방지) — 고아 정리는 별도 reconcile 로.
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: expire-sam-artifacts
            Status: Enabled
            Prefix: prod/sam-artifacts/
            ExpirationInDays: 14
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']     # presigned GET(<img> 로드)용 — 서명이 권한이라 origin 넓게.
            AllowedHeaders: ['*']
            MaxAge: 3000

  # provider 키 시크릿(content-maker)은 외부에서 생성·관리한다(jwt-secret/prod-connect 와 동일 패턴). 스택은 참조만.

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content-maker-api
      CodeUri: .
      Handler: lambda.handler
      Environment:
        Variables:
          STORAGE: s3
          S3_BUCKET: !Ref MediaBucketName
          S3_REGION: !Ref AWS::Region
          S3_URL_TTL: '21600'        # presigned GET 만료(초) — 6h. 탭을 오래 열어둬도 <img>/<video> 가 덜 깨지도록(기본 3600 에서 상향).
          SECRETS_ID: !Ref ProviderSecretName
          JWT_SECRET_ID: prod/connect
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          OPENAI_TEXT_MODEL: !Ref OpenAiTextModel
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucketName
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProviderSecretName}-*'   # provider 키(content-maker, 외부 관리)
                - !Ref JwtSecretArn      # 기존 prod/connect (jwt-secret)
      # CORS 는 lambda.mjs(corsHeaders + ALLOWED_ORIGINS origin 검증)가 전담한다.
      # Function URL 의 Cors 를 켜면 ACAO 헤더가 '중복'되어 브라우저 CORS 가 깨지므로 여기선 설정하지 않는다.
      FunctionUrlConfig:
        AuthType: NONE     # 인증은 앱이 JWT(prod/connect)로 직접 검증.

Outputs:
  FunctionUrl:
    Description: 콘솔 SERVER_API_BASE / 설정 '백엔드 URL' 에 입력.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  MediaBucket:
    Value: !Ref MediaBucket
  ProviderSecretName:
    Value: !Ref ProviderSecretName
